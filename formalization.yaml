status:
  scope: >-
    TEMPLATE: to be finalised once [OPEN] item 2 is settled. Draft follows.

    Formalised in full, with no sorry and no axioms beyond propext,
    Classical.choice and Quot.sound: the infinitary stepping-up lemmas
    stepping_up_eta_one (eta(r) = 1 for r >= 5), stepping_up_eta_two_r4
    (eta(4) = 2) and stepping_up_eta_one_r3 (eta(3) = 1), each an instance of
    a single stepping_up_of_colouring; the finitary counterparts in
    SteppingUpLemma/Arrow.lean, obtained from these by transport rather than
    by a separate finitary construction; the validity of the colour tables,
    reduced by the Lean kernel rather than by compiled evaluation; and the
    tree combinatorics they rest on.

    Not formalised: the multicolour Ramsey lower bounds that these lemmas
    imply as an application.
