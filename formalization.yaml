fidelity:
  divergences: >-
    Colourings are total functions carrying their colour bound in the type:
    Finset N -> Fin k in the finitary statements, and Finset V -> Set.Iio k
    in the infinitary ones, where Set.Iio k is the type of ordinals below k.
    Nothing is claimed about their values on sets that are not r-subsets of
    the ground set, so totality is not a strengthening. This is equivalent to
    the sources' formulation, which colours only the r-subsets.

    The infinitary statements are the primary ones: the finitary
    stepping_up_* theorems are transported from their Infinitary counterparts
    rather than proved from a separate finitary construction.

    TEMPLATE: record any further divergence from the companion paper here.

