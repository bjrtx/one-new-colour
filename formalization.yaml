version: "v0.4"

project:
  name: "One new colour suffices for stepping up"
  description: >-
    A Lean 4 formalisation of negative stepping-up lemmas for Erdős–Rado
    partition relations. A negative relation n -/-> (s_i)^r_{i<k} asserts a
    colouring of the r-subsets of an n-element ground set with no large
    monochromatic set; a stepping-up lemma propagates such a failure from
    uniformity r to uniformity r + 1 over a ground set of size 2^n, at the
    cost of larger goals and some number eta(r) of additional colours.

    Jartoux, Keller, Smorodinsky and Yuditsky (SIAM J. Discrete Math. 36
    (2022), Theorem 1.2) achieve minimally increasing goals at a cost of
    eta(3) = 1, eta(4) = 3 and, for r >= 5, eta(r) = 2 for odd r and 3 for
    even r. This development proves that one additional
    colour suffices for every r >= 5, and that two rather than three suffice
    at r = 4, tightening the associated multicolour Ramsey lower bounds. The
    combinatorial core is reduced to a finite check over a table of 69 classes
    against 621 constraints, discharged by the Lean kernel rather than by
    compiled evaluation, so the development uses no reflection axiom.

    The results are proved in an infinitary setting in which the ground-set
    size and each colour's target size are arbitrary cardinals and the colour
    count is an arbitrary ordinal, and the finitary statements are obtained
    from these by transport.
  authors:
    - "Bruno Jartoux"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Bruno Jartoux"

# `repository` is intentionally omitted: this repository is itself the
# substantive proof development, not a thin Comparator wrapper.

